[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle basics. I: import sorting. B: flake8-bugbear
# (catches real bugs like mutable default args, not just style).
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # line length is a formatter's job, not worth failing CI over
    "B008",  # FastAPI's Depends(...)-as-default is the documented pattern,
             # not the mutable-default-argument bug this rule looks for -
             # FastAPI's DI system calls it per-request, not once at def time.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
